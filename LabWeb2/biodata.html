<!DOCTYPE html>
<html lang="id">
<head>
 <meta charset="UTF-8">
 <title>Biodata Mahasiswa</title>

<body>

<!-- Semantic structure: header, nav, main, section, footer -->
<header><h1>Biodata Mahasiswa</h1></header>

<nav>
 <a href="index.html">Beranda</a>
 <a href="#biodata">Biodata</a>
 <a href="#form">Form</a>
 <a href="#multimedia">Multimedia</a>
</nav>

<main>

 <!-- Tabel data -->
 <section id="biodata">
 <h2>Data Mahasiswa</h2>
 <table border="1">
 <tr><th>Data</th><th>Keterangan</th></tr>
 <tr><td>NIM</td><td>312510141</td></tr>
 <tr><td>Nama</td><td>Fajar Dwi Santoso</td></tr>
 <tr><td>Program Studi</td><td>Teknik Informatika</td></tr>
 </table>
 </section>

 <!-- Form dengan validasi dasar (required) -->
 <section id="form">
 <h2>Form Biodata</h2>
 <form>
 <label for="nama">Nama</label>
 <input type="text" id="nama" name="nama" required>
 <br><br>

 <label for="email">Email</label>
 <input type="email" id="email" name="email" required>
 <br><br>

 <label for="prodi">Program Studi</label>
 <select id="prodi" name="prodi" required>
 <option value="">-- Pilih --</option>
 <option value="ti">Teknik Informatika</option>
 <option value="si">Sistem Informasi</option>
 </select>
 <br><br>

 <label for="alamat">Alamat</label><br>
 <textarea id="alamat" name="alamat" required></textarea>
 <br><br>

 <button type="submit">Simpan</button>
 <button type="reset">Reset</button>
 </form>
 </section>

 <!-- Elemen multimedia (tambahan agar memenuhi syarat tugas) -->
 <section id="multimedia">
 <h2>Video Perkenalan</h2>
 <video controls width="480">
 <source src="media/video.mp4" type="video/mp4">
 Browser tidak mendukung video.
 </video>
 </section>

</main>
